<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smartmall TCG — BETA 4.2 · Colecciones</title>
<link rel="stylesheet" href="assets/styles.css">

</head>
<body>

<header>
  <a class="brand" href="index.html" style="text-decoration:none;color:inherit">
    <img src="assets/logo.png" alt="Smartmall TCG">
    <div><div class="brand-title">SMARTMALL TCG</div><div class="brand-sub">Pokémon TCG · Catálogo</div></div>
  </a>
  <div class="header-spacer"></div>
  <nav class="header-nav">
    <a class="nav-link" href="index.html">Inicio</a>
    <a class="nav-link" href="colecciones.html">Colecciones</a>
    <a class="nav-link" href="compras-mayoristas.html">Compras Mayoristas</a>
    <a class="nav-link" href="compras-minoristas.html">Compras Minoristas</a>
    <a class="nav-link" href="puntos-venta.html">Puntos de venta</a>
  </nav>
</header>


<main class="page-container">
  <a class="back-link" href="index.html">← Inicio</a>
  <div class="page-heading">
    <div class="kicker">Smartmall TCG · Catálogo</div>
    <h1>Colecciones</h1>
    <p>Elegí una expansión y explorá sus cartas.</p>
  </div>
  <div id="collections" class="collections-grid"></div>
</main>
<script src="assets/catalog.js"></script>
<script>
const root=document.getElementById("collections");
root.innerHTML=COLLECTIONS.map(c=>`
  <a class="collection-link" href="cartas.html?set=${encodeURIComponent(c.code)}">
    <article class="set">
      <img src="assets/collections/${c.code}.png" alt="${c.name}" loading="lazy">
      <h3>${c.display} — ${c.name}</h3>
      <div class="lang">${c.languageLabel}</div>
    </article>
  </a>
`).join("");
</script>


</body>
</html>
